{{- $architecture := or .architecture "arm64" -}}
{{- $device := or .device "pinephone" -}}

architecture: {{ $architecture }}

actions:
  - action: run
    description: Ensure we have a valid extlinux.conf
    chroot: true
    command: /etc/kernel/postinst.d/zz-u-boot-menu "$(linux-version list | linux-version sort | tail -1)"

  - action: run
    description: Configure alternative vccq boot
    chroot: true
    script: bootloader.sh
