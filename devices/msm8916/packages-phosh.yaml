{{- $architecture := or .architecture "arm64" -}}

architecture: {{ $architecture }}

actions:
  - action: run
    description: Install custom packages
    chroot: true
    command: apt-get -y install /etc/apt/packages/*.deb

  - action: apt
    recommends: false
    description: Install device-specific packages
    packages:
      - mkbootimg
      - mobian-phosh-phone
      - firefox-esr-mobile-config
      - openssh-server
