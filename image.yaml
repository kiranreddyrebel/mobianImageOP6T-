{{- $architecture := or .architecture "arm64" -}}
{{- $family := or .family "sunxi" }}
{{- $device := or .device "pinephone" }}
{{- $partitiontable := or .partitiontable "gpt" }}
{{- $filesystem := or .filesystem "ext4" }}
{{- $environment := or .environment "phosh" -}}
{{- $image := or .image "mobian" -}}
{{- $imagesize := or .imagesize "8GB" }}
{{- $miniramfs := or .miniramfs "false" }}
{{- $zram := or .zram "false" -}}
{{- $bootstart := or .bootstart "1MiB" }}
{{- $nonfree := or .nonfree "false" -}}
{{- $rootfs := or .rootfs "rootfs.tar.xz" }}
{{- $password := or .password "1234" -}}
{{- $crypt_password := or .crypt_password $password -}}
{{- $crypt_root := or .crypt_root "false" -}}
{{- $bootonroot := or .bootonroot "false" }}
{{- $ssh := or .ssh "" -}}
{{- $username := or .username "mobian" -}}

architecture: {{ $architecture }}

actions:
  - action: unpack
    file: {{ $rootfs }}

{{ if eq $nonfree "true" }}
  - action: run
    description: Enable non-free-firmware repos
    chroot: true
    script: scripts/setup-apt-nonfree.sh true
{{ end }}

  - action: recipe
    recipe: include/partition-{{ $partitiontable }}.yaml
    variables:
      bootstart: {{ $bootstart }}
      filesystem: {{ $filesystem }}
      image: {{ $image }}
      imagesize: {{ $imagesize }}
      installer: "false"
      bootonroot: {{ $bootonroot }}

  - action: filesystem-deploy
    description: Deploy filesystem onto image
{{ if eq $crypt_root "true" }}
    setup-fstab: false

  - action: run
    description: Encrypt root filesystem
    label: setup-luks
    script: scripts/setup-luks.sh {{ $crypt_password }} {{ $bootonroot }} {{ $architecture }}

  - action: recipe
    recipe: include/packages-fde.yaml
{{ end }}

{{ if eq $filesystem "btrfs" }}
  - action: apt
    recommends: true
    description: Install btrfs progs
    packages:
      - btrfs-progs
{{ end }}

{{ if eq $filesystem "f2fs" }}
  - action: apt
    recommends: true
    description: Install F2FS tools
    packages:
      - f2fs-tools
{{ end }}

{{ if eq $zram "true" }}
  - action: run
    description: setup zram (fstab)
    chroot: true
    script: scripts/setup-zram-mounts.sh
{{ end }}

  - action: recipe
    recipe: devices/{{ $family }}/packages-base.yaml
    variables:
      device: {{ $device }}
      nonfree: {{ $nonfree }}

  - action: recipe
    recipe: devices/{{ $family }}/packages-{{ $environment }}.yaml
    variables:
      device: {{ $device }}

{{ if eq $family "qcom" }}
  # --- Custom additions (kernel + extra packages) ---------------------------
  - action: overlay
    description: Copy custom kernel .deb files into the image
    source: custom
    destination: /srv/custom

  - action: apt
    recommends: true
    description: Install extra packages from the Debian/Mobian repos
    packages:
      - htop
      - vim

  - action: run
    chroot: true
    description: Install custom kernel (apt resolves its dependencies)
    command: pwd && cp -a /srv/custom/firmware /usr/lib && apt-get install -y --no-install-recommends /srv/custom/linux-*.deb && bash /srv/custom/install-mobian-volte-stack-direct.sh && bash /srv/custom/install-oneplus-sdm845-firmware.sh && bash /srv/custom/install-oneplus-fajita-device.sh && bash /srv/custom/touch-to-work-aftersuspend.sh && bash /srv/custom/qcom-files.sh && systemctl enable qbootctl.service && systemctl enable q6voiced.service && systemctl enable 81voltd.service && systemctl enable call_audio_idle_suspend_workaround.service && systemctl enable touch-rebind.service && rm -rf /srv/custom
{{ end }}

{{ if $ssh }}
  - action: apt
    description: Install OpenSSH server
    packages:
      - openssh-server

  - action: overlay
    description: Set up sshd configuration (key-only login)
    source: overlays/sshd_config.d/
    destination: /etc/ssh/sshd_config.d/

  - action: overlay
    description: Install authorized_keys for {{ $username }}
    source: overlays/ssh/
    destination: /home/{{ $username }}/.ssh/

  - action: run
    description: Fix ownership and permissions of .ssh
    chroot: true
    command: chown -R {{ $username }}:{{ $username }} /home/{{ $username }}/.ssh/ && chmod 700 /home/{{ $username }}/.ssh && chmod 600 /home/{{ $username }}/.ssh/authorized_keys
{{ end }}

{{ if eq $miniramfs "true" }}
  - action: apt
    recommends: true
    description: install miniramfs
    packages:
      - miniramfs
{{ end }}

{{ if eq $crypt_root "true" }}
# When building with fakemachine, the initrd crypttab is empty
# We need this additional step which fully mounts /dev so cryptsetup
# can create a proper crypttab
  - action: run
    description: Force initramfs update
    chroot: true
    script: scripts/update-initramfs.sh
{{ end }}

  - action: run
    description: Cleanup filesystem
    chroot: true
    script: scripts/rootfs-cleanup.sh

  - action: recipe
    recipe: devices/{{ $family }}/bootloader.yaml
    variables:
      device: {{ $device }}
      image: {{ $image }}
      bootstart: {{ $bootstart }}
      miniramfs: {{ $miniramfs }}
