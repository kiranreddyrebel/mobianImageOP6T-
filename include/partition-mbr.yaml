{{- $architecture := or .architecture "arm64" -}}
{{- $filesystem := or .filesystem "ext4" }}
{{- $image := or .image "mobian-$device.img" -}}
{{- $imagesize := or .imagesize "3.8GB" }}
{{- $rootstart := or .rootstart "300MiB" }}
{{- $target := or .target false }}

architecture: {{ $architecture }}

actions:
  - action: image-partition
    imagename: {{ $image }}
    imagesize: {{ $imagesize }}
    partitiontype: msdos
    mountpoints:
      - mountpoint: /
        partition: rootfs
      - mountpoint: /boot
        partition: boot
    partitions:
      - name: boot
        fs: ext4
        start: 8MiB
        end: 300MiB
        flags: [ boot ]
    {{ if $target }}
      - name: target
        start: 300MiB
        end: {{ $rootstart }}
    {{ end }}
      - name: rootfs
        fs: {{ $filesystem }}
        start: {{ $rootstart }}
        end: 100%
