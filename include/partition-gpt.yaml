{{- $architecture := or .architecture "amd64" -}}
{{- $filesystem := or .filesystem "ext4" }}
{{- $image := or .image "mobian-$device.img" -}}
{{- $imagesize := or .imagesize "3.8GB" }}
{{- $rootstart := or .rootstart "512MiB" }}
{{- $target := or .target false }}

architecture: {{ $architecture }}

actions:
  - action: image-partition
    imagename: {{ $image }}
    imagesize: {{ $imagesize }}
    partitiontype: gpt
    mountpoints:
      - mountpoint: /
        partition: rootfs
      - mountpoint: /boot
        partition: boot
      - mountpoint: /boot/efi
        partition: esp
    partitions:
      - name: esp
        fs: fat32
        start: 0%
        end: 256MiB
        flags: [ esp, boot ]
      - name: boot
        fs: ext4
        start: 256MiB
        end: 600MiB
    {{ if $target }}
      - name: target
        start: 600MiB
        end: {{ $rootstart }}
    {{ end }}
      - name: rootfs
        fs: {{ $filesystem }}
        start: {{ $rootstart }}
        end: 100%
