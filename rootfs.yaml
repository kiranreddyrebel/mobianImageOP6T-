{{- $architecture := or .architecture "arm64" -}}
{{- $username := or .username "mobian" -}}
{{- $password := or .password "1234" -}}
{{- $hostname := or .hostname "mobian" -}}
{{- $environment := or .environment "phosh" -}}
{{- $contrib := or .contrib "false" -}}
{{- $nonfree := or .nonfree "false" -}}
{{- $ssh := or .ssh "" -}}
{{- $zram:= or .zram "false" -}}
{{- $debian_suite := or .debian_suite "bookworm" -}}
{{- $suite := or .suite $debian_suite -}}
{{- $rootfs := or .rootfs "rootfs.tar.gz" }}

architecture: {{ $architecture }}

actions:
  # silence debootstrap warning
  - action: run
    description: "Debootstrap Debian {{ $debian_suite }} minbase, contrib: {{ $contrib }}, nonfree: {{ $nonfree }}"
    command: mkdir -p /etc/apt/apt.conf.d/
  - action: debootstrap
    suite: {{ $debian_suite }}
    mirror: http://deb.debian.org/debian
    variant: minbase
    components:
      - main
{{ if eq $contrib "true" }}
      - contrib
{{ end }}
{{ if eq $nonfree "true" }}
      - non-free
{{ end }}

  - action: overlay
    description: Setup Mobian apt repository and install local debs
    source: overlays/apt/
    destination: /
  - action: run
    chroot: true
    script: scripts/setup-apt.sh {{ $debian_suite }} {{ $suite }} {{ $contrib }} {{ $nonfree }} "rootfs*.deb"

  - action: recipe
    recipe: include/packages-base.yaml
    variables:
      ssh: {{ $ssh }}

  - action: recipe
    recipe: include/packages-{{ $environment }}.yaml

  - action: run
    description: Set up default user
    chroot: true
    script: scripts/setup-user.sh {{ $username }} {{ $password }}

{{ if $ssh }}
  - action: overlay
    description: Setup openssh-server configuration
    source: overlays/openssh-server
    destination: /

  - action: overlay
    description: Setup user's ssh configuration
    source: overlays/user-ssh/
    destination: /home/{{ $username }}/.ssh/

  - action: run
    description: Set owner of .ssh
    chroot: true
    command: chown -R {{ $username }}:{{ $username }} /home/{{ $username }}/.ssh/
{{ end }}

{{ if eq $zram "true" }}
  - action: overlay
    description: setup zram devices
    source: overlays/zram/
    destination: /etc/
{{ end }}

  - action: run
    description: Set up system
    chroot: true
    script: scripts/setup-system.sh {{ $hostname }}

  - action: pack
    file: {{ $rootfs }}
